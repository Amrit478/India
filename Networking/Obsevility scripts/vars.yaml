# ==========================================
# Global Collector & Management Settings
# ==========================================
collector_ip: "10.10.0.100"
ntp_server: "10.10.0.1"
snmp_community: "public"

# Observability Ports & Protocols
syslog_port: 1514
netflow_export_port: 2055
netflow_protocol: "ipfix" # Options: 'ipfix' or 'netflow-v9'


# ==========================================
# Cisco Devices
# ==========================================
devices:

  # ----------------------------------------
  # R3 - IOL L3 Router
  # ----------------------------------------
  - hostname: "R3"
    ip: "10.10.10.1"
    device_type: "cisco_ios"
    source_interface: "Ethernet0/1"
    location: "EVE-NG Core Rack"
    contact: "Admin"
    netflow_interfaces:
      - "Ethernet0/0"
      - "Ethernet0/1"

  # ----------------------------------------
  # R1 - IOL L2 Switch
  # ----------------------------------------
  - hostname: "R1"
    ip: "10.10.10.2"
    device_type: "cisco_ios"
    source_interface: "Vlan10"
    location: "EVE-NG Lab Access 1"
    contact: "Admin"
    netflow_interfaces:
      - "Vlan10"

  # ----------------------------------------
  # R2 - IOL L2 Switch
  # ----------------------------------------
  - hostname: "R2"
    ip: "10.10.20.2"
    device_type: "cisco_ios"
    source_interface: "Vlan20"
    location: "EVE-NG Lab Access 2"
    contact: "Admin"
    netflow_interfaces:
      - "Vlan20"
