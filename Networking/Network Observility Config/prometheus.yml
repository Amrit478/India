global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  ##################################################
  # PROMETHEUS
  ##################################################
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  ##################################################
  # XUBUNTU MONITORING SERVER
  ##################################################
  - job_name: xubuntu
    static_configs:
      - targets:
          - node-exporter:9100

  ##################################################
  # NETFLOW / IPFIX COLLECTOR (goflow2) METRICS
  ##################################################
  - job_name: goflow2
    static_configs:
      - targets:
          - goflow2:8080

  ##################################################
  # CISCO DEVICES USING SNMP
  ##################################################
  - job_name: cisco-snmp
    metrics_path: /snmp
    params:
      module:
        - if_mib
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cisco.yml
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  ##################################################
  # ICMP PING MONITORING
  ##################################################
  - job_name: icmp
    metrics_path: /probe
    params:
      module:
        - icmp
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/icmp.yml
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  ##################################################
  # TCP PORT MONITORING
  ##################################################
  - job_name: tcp
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/tcp.yml
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
